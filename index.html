    <!-- Early beforeinstallprompt Capture & Service Worker Registration -->
    <script>
      // Capture beforeinstallprompt immediately on window to prevent race conditions
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(event) {
        event.preventDefault();
        window.__pwaInstallPrompt = event;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
        console.log('[PWA] beforeinstallprompt event captured and ready.');
      });

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              // Try fallback service-worker.js if sw.js registration hits an unexpected error
              navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
                .then(function(reg) {
                  console.log('[PWA] Fallback service-worker.js registered:', reg.scope);
                })
                .catch(function(fallbackErr) {
                  console.warn('[PWA] Service Worker registration failed:', fallbackErr);
                });
            });
        });
      }
    </script>
